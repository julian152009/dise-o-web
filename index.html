<!DOCTYPE html> <!-- "Define que el documento es HTML5 y ayuda al navegador a interpretarlo correctamente" -->
<html lang="es"> <!-- "Es el contenedor principal o elemento raíz que envuelve todo el contenido de la página web" -->

<head> <!-- "Contiene información técnica, metadatos y enlaces a recursos que no son directamente visibles en la página" -->
    <meta charset="UTF-8"> <!-- "Especifica la codificación de caracteres para que acentos y caracteres especiales se muestren bien" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- "Ajusta el contenido para que se vea correctamente en dispositivos móviles" -->
    <title>Ejemplo de Etiquetas</title> <!-- "Establece el título que aparecerá en la pestaña del navegador web" -->
</head>

<body> <!-- "Contiene todo el contenido visible (textos, imágenes, enlaces) que verán los usuarios al visitar la página" -->

    <header> <!-- "Define la zona de cabecera de la página, usualmente contiene logos o títulos" -->
        <h1>Mi Página Web</h1> <!-- "Define el título principal de la página, siendo el encabezado de mayor importancia" -->
    </header>

    <nav> <!-- "Agrupa una sección de enlaces diseñados para la navegación principal del sitio" -->
        <a href="#inicio">Inicio</a> <!-- "Crea un hipervínculo que permite al usuario navegar a otra página o sección" -->
        <a href="#contacto">Contacto</a>
    </nav>

    <main> <!-- "Contiene el contenido principal y único del documento, excluyendo cabeceras, pies de página o barras laterales" -->
        
        <section> <!-- "Agrupa contenido temáticamente relacionado dentro del documento" -->
            <h2>Sobre las etiquetas</h2> <!-- "Define un subtítulo o encabezado de segundo nivel de importancia" -->
            <p>Este es un párrafo de texto.</p> <!-- "Crea un bloque de texto estándar (párrafo)" -->
            
            <img src="https://via.placeholder.com/150" alt="Imagen de ejemplo"> <!-- "Permite insertar y mostrar una imagen gráfica en la página" -->
            
            <ul> <!-- "Crea una lista desordenada, donde los elementos se marcan con viñetas o puntos" -->
                <li>Elemento uno</li> <!-- "Define cada elemento individual dentro de una lista" -->
                <li>Elemento dos</li>
            </ul>
        </section>
        
        <article> <!-- "Define un bloque de contenido independiente que tiene sentido por sí mismo, como una noticia o post" -->
            <h3>Sección interactiva</h3> <!-- "Define un encabezado de tercer nivel" -->
            
            <div> <!-- "Es un contenedor genérico de bloque, muy utilizado para agrupar elementos y darles diseño con CSS" -->
                <span>Texto destacado</span> <!-- "Es un contenedor genérico en línea, ideal para aplicar estilos a fragmentos de texto específicos" -->
                <br> <!-- "Inserta un salto de línea simple (enter) en el texto" -->
                <button>Haz clic aquí</button> <!-- "Crea un botón interactivo que el usuario puede presionar" -->
            </div>
        </article>

    </main>

    <footer> <!-- "Define el pie de página, usado generalmente para información de contacto, enlaces legales o derechos de autor" -->
        <p>Derechos de autor © 2026</p>
    </footer>

</body>

</html>
